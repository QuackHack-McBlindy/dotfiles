  <style>:root {
  --bg: #050707; --panel: #0b1110; --panel2: #0e1716;
  --teal: #11e6d2; --teal2: #05a99f;
  --gold: #f4b52f; --gold2: #ffdc72;
  --green: #5eea8f; --red: #ff5470; --pink: #ff7ab8;

  --frame-header-h: 260px; --frame-bottom-h: 64px;

  --frame-z: 10000;
  --mask-left-w: 214px; --mask-right-w: 214px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 50% -10%, rgba(0, 221, 204, .10), transparent 34rem),
    radial-gradient(circle at 90% 45%, rgba(244, 181, 47, .07), transparent 28rem),
    var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(circle at 20% 80%, rgba(17, 230, 210, .08), transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(244, 181, 47, .08), transparent 40%);
  animation: aurora 20s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes aurora {
  0%   { opacity: .5; transform: scale(1); }
  100% { opacity: 1;  transform: scale(1.15); }
}
a { color: inherit; text-decoration: none; }
.wrap { width: min(calc(100vw - var(--mask-left-w) - var(--mask-right-w) - 40px), var(--max)); margin: auto; }
.gold { color: var(--gold); } .white { color: #fff; } .muted { color: var(--muted); }
.teal { color: var(--teal); } .green { color: var(--green); } .pink { color: var(--pink); }
.purple { color: var(--purple); } .red { color: var(--red); } .blue { color: var(--blue); }

#top {
  min-height: 0 !important;
  height: 0 !important;
  padding: 0 !important;
  margin: 0 !important;
  overflow: hidden;
}
#top::before { display: none !important; }

main {
  padding-top: calc(var(--frame-header-h) + 20px);
  padding-bottom: calc(var(--frame-bottom-h) + 20px);
}
.content-section { padding: 20px 0 50px; }

.reveal { opacity: 0; transform: translateY(22px); transition: .7s ease; }
.reveal.in { opacity: 1; transform: none; }

footer { padding: 26px 0 34px; border-top: 1px solid var(--line); }
.footer-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .92rem;
}
.footer-links a { color: var(--teal); transition: color .2s ease; }
.footer-links a:hover { color: var(--gold); }

.glitch { animation: glitch 3s linear infinite; }
@keyframes glitch {
  0%, 4%, 8%, 12%, 100% { filter: none; }
  1%, 5%, 9% { filter: url(#f1); }
}
.hue-shift { animation: hueshift 45s ease-in-out infinite; }
@keyframes hueshift {
  0%, 50% { filter: hue-rotate(0deg); }
  60% { filter: hue-rotate(360deg); }
  70% { filter: hue-rotate(0deg); }
  80% { filter: hue-rotate(360deg); }
  90% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}


@media (max-width: 1199px), (max-height: 699px) {
    main {
        padding-top: calc(var(--frame-header-h, 260px) + 20px) !important;
        padding-bottom: calc(var(--frame-bottom-h, 64px) + 20px) !important;
    }
}

@media (min-width: 3440px),
       (min-aspect-ratio: 1/2) and (max-aspect-ratio: 9/16) {
    main {
        padding-top: 20px !important;
        padding-bottom: 24px !important;
    }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
  .reveal { opacity: 1; transform: none; }
  body::before { animation: none; opacity: .6; }
  .glitch, .hue-shift { animation: none !important; }
}

<script>
(function () {
  'use strict';

  function escapeHTML(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function escapeAttr(str) {
    return escapeHTML(str).replace(/"/g, '&quot;');
  }

  var gallery = document.getElementById('hardware-gallery');
  if (!gallery) return;

  var lightbox = document.createElement('div');
  lightbox.className = 'lightbox';
  lightbox.setAttribute('role', 'dialog');
  lightbox.setAttribute('aria-modal', 'true');
  lightbox.setAttribute('aria-label', 'Media viewer');
  lightbox.innerHTML =
    '<button class="lightbox-close" type="button" aria-label="Close viewer">×</button>' +
    '<div class="lightbox-content">' +
      '<div class="lightbox-media"></div>' +
      '<div class="lightbox-caption"></div>' +
    '</div>';
  document.body.appendChild(lightbox);

  var mediaContainer = lightbox.querySelector('.lightbox-media');
  var captionEl = lightbox.querySelector('.lightbox-caption');
  var closeBtn = lightbox.querySelector('.lightbox-close');

  var currentIndex = 0;
  var mediaList = [];
  var lastFocused = null;

  function renderMedia(index) {
    var item = mediaList[index];
    if (!item) return;
    currentIndex = index;
    mediaContainer.innerHTML = "";

    var src = '/static/pics/hardware/' + item.src;

    if (item.type === 'image') {
      var img = document.createElement('img');
      img.src = src;
      img.alt = item.caption || "";
      mediaContainer.appendChild(img);
    } else {
      var video = document.createElement('video');
      video.src = src;
      video.controls = true;
      video.autoplay = true;
      video.muted = false;
      mediaContainer.appendChild(video);
    }

    captionEl.textContent = item.caption || "";
  }

  function openLightbox(index) {
    lastFocused = document.activeElement;
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
    renderMedia(index);
    closeBtn.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = "";
    mediaContainer.innerHTML = "";
    if (lastFocused && typeof lastFocused.focus === 'function') {
      lastFocused.focus();
    }
    lastFocused = null;
  }

  closeBtn.addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('active')) return;

    if (e.key === 'Escape') {
      closeLightbox();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      renderMedia((currentIndex - 1 + mediaList.length) % mediaList.length);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      renderMedia((currentIndex + 1) % mediaList.length);
    } else if (e.key === 'Tab') {
      var focusable = lightbox.querySelectorAll('button, [href], video, [tabindex]:not([tabindex="-1"])');
      if (!focusable.length) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  function loadHardwareGallery() {
    fetch('/static/pics/hardware/media.json', { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (media) {
        mediaList = Array.isArray(media) ? media : [];

        if (mediaList.length === 0) {
          gallery.innerHTML = '<div class="gallery-empty">No hardware media yet.</div>';
          return;
        }

        gallery.innerHTML = mediaList.map(function (item, i) {
          var thumbSrc = '/static/pics/hardware/' + (item.thumb || item.src);
          var fullSrc  = '/static/pics/hardware/' + item.src;
          var altText  = escapeAttr(item.caption || "");

          var mediaEl = item.type === 'image'
            ? '<img src="' + escapeAttr(thumbSrc) + '" alt="' + altText + '" loading="lazy">'
            : '<video src="' + escapeAttr(fullSrc) + '" muted preload="metadata" aria-label="' + altText + '"></video>';

          var capEl = item.caption
            ? '<div class="hw-caption">' + escapeHTML(item.caption) + '</div>'
            : "";

          return '<button class="hw-item" type="button" data-index="' + i + '" aria-label="View ' + (altText || 'media') + '">' +
            mediaEl +
            capEl +
          '</button>';
        }).join("");

        Array.prototype.forEach.call(
          gallery.querySelectorAll('.hw-item'),
          function (el) {
            el.addEventListener('click', function () {
              var index = parseInt(el.dataset.index, 10);
              if (!isNaN(index)) openLightbox(index);
            });
          }
        );
      })
      .catch(function (err) {
        console.error('Hardware gallery error:', err);
        gallery.innerHTML = '<div class="gallery-empty">Could not load hardware media.</div>';
      });
  }

  loadHardwareGallery();
})();
</script>

        <feTurbulence type="fractalNoise" baseFrequency="0 0.15" numOctaves="1" result="warp"/>
        <feDisplacementMap xChannelSelector="R" yChannelSelector="G" scale="30" in="SourceGraphic" in2="warp"/>

        <feOffset in="red_" dx="2" dy="0" result="red"/>
        <feColorMatrix type="matrix" in="SourceGraphic" result="blue_" values="0 0 0 0 0 0 3 0 0 0 0 0 10 0 0 0 0 1 0"/>

  <noscript>
    <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
  </noscript>

  <script>
  (function () {
    'use strict';
    const yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
    } else {
      document.querySelectorAll('.reveal').forEach((el) => el.classList.add('in'));
    }

    function setupRelatedPosts() {
      var section = document.getElementById('similar-section');
      var container = document.getElementById('similar-posts');
      var myLink = document.body.dataset.postLink;
      if (!section || !container || !myLink) return;

      function esc(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
      }

      fetch('/posts.json')
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(posts) {
          if (!Array.isArray(posts)) return;

          var current = null;
          for (var i = 0; i < posts.length; i++) {
            try {
              if (new URL(posts[i].link, window.location.origin).pathname === myLink) {
                current = posts[i];
                break;
              }
            } catch (_) { /* skip malformed link */ }
          }

          if (!current || !Array.isArray(current.tags) || current.tags.length === 0) return;

          var scored = [];
          for (var j = 0; j < posts.length; j++) {
            var p = posts[j];
            if (p.link === current.link) continue;
            var shared = 0;
            if (Array.isArray(p.tags)) {
              for (var k = 0; k < p.tags.length; k++) {
                if (current.tags.indexOf(p.tags[k]) !== -1) shared++;
              }
            }
            if (shared > 0) scored.push({ post: p, score: shared });
          }

          scored.sort(function(a, b) { return b.score - a.score; });
          scored = scored.slice(0, 3);
          if (scored.length === 0) return;

          var html = "";
          for (var m = 0; m < scored.length; m++) {
            var q = scored[m].post;
            html +=
              '<a class="cross-link" href="' + esc(q.link) + '">' +
                '<span class="cl-icon" aria-hidden="true">🔗</span>' +
                '<div class="cl-body">' +
                  '<h3 class="cl-title">' + esc(q.title) + '</h3>' +
                  '<p class="cl-desc">' + esc(q.description || "") + '</p>' +
                '</div>' +
                '<span class="cl-arrow" aria-hidden="true">→</span>' +
              '</a>';
          }

          container.innerHTML = html;
          section.hidden = false;
        })
        .catch(function() { /* silent */ });
    }

    setupRelatedPosts();

    document.querySelectorAll('.copy-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const block = btn.closest('.config-block');
        const code = block ? block.querySelector('pre code') : null;
        if (!code) return;
        try {
          await navigator.clipboard.writeText(code.textContent);
          btn.textContent = 'Copied ✓';
          setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        } catch (_) {
          btn.textContent = 'Failed';
        }
      });
    });
  })();
  </script>
</body>
