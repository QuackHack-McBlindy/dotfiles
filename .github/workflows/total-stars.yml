name: Update total stars SVG

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "hooks/star-history.sh"
      - ".github/workflows/total-stars.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: QuackHack-McBlindy
        run: bash hooks/star-history.sh
      - name: Commit chart
        run: |
          if [[ -n "$(git status --porcelain home/total-stars.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add home/total-stars.svg
            git commit -m "Update total stars chart"
            git push
          fi
