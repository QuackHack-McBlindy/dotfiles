# .pre-commit-config.yaml

exclude: '(^|/)(dump|secrets)(/|$)|(^|/)\.env($|\.)'

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: '^(docs/|dist/|vendor/|.*\.snap$|.*\.md$)'
      - id: end-of-file-fixer
        exclude: '^(docs/|dist/|vendor/|.*\.snap$)'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-flake-local-inputs
        name: Check for local flake inputs
        entry: bash hooks/no-local-flake-inputs.sh
        language: system
        pass_filenames: false
        files: ^(flake\.nix|flake\.lock)$
        always_run: true

  - repo: local
    hooks:
      - id: update-readme
        name: Update README.md
        entry: bash hooks/update-readme.sh
        language: system
        pass_filenames: false
        always_run: true
