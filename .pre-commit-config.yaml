# .pre-commit-config.yaml

exclude: '(^|/)(dump|secrets)(/|$)|(^|/)\.env($|\.)'

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: '^(docs/|dist/|vendor/|.*\.snap$|.*\.md$)'
      - id: end-of-file-fixer
        exclude: '^(docs/|dist/|vendor/|.*\.snap$)'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-secrets
        name: Check Secrets
        entry: bash hooks/check-secrets.sh
        language: system
        pass_filenames: false
        always_run: true
